info:
  app:
    name: event-service
    description: Event service module

server:
  port: ${PORT:8080}

management:
  endpoints:
    enabled-by-default: true #todo: fix
    web:
      exposure:
        include: info, health, env, metrics, prometheus
    jmx:
      exposure:
        exclude: health
  endpoint:
    health:
      enabled: true #todo: fix
      show-details: always
    prometheus:
      access: unrestricted
    metrics:
      access: unrestricted
  prometheus:
    metrics:
      export:
        enabled: true
  info:
    env:
      enabled: true
  health:
    livenessstate: #todo: fix
      enabled: true
    readinessstate:
      enabled: true
  observations:
    key-values:
      application: ${info.app.name}

logging:
  level:
    root: INFO
    renovation.event.service: DEBUG
    org.hibernate:
      SQL: DEBUG
      type:
        descriptor:
          sql:
            BasicBinder: TRACE

spring:
  application:
    name: ${info.app.name}

  docker:
    compose:
      lifecycle-management: start_and_stop
      file: docker-compose.yml

  json:
    add:
      type:
        headers: false
    value:
      default:
        type: io.confluent.kafka.streams.serdes.avro.SpecificAvroSerde


  kafka:
    topic:
      name: "event-topic"
    bootstrap-servers: "${KAFKA_0_BOOSTRAP_SERVER:localhost}:${KAFKA_0_BOOSTRAP_SERVER_PORT:29092},${KAFKA_1_BOOSTRAP_SERVER:localhost}:${KAFKA_1_BOOSTRAP_SERVER_PORT:29092}"
    schema:
      registry:
        url: http://${SCHEMA_REGISTRY_HOST:localhost}:${SCHEMA_REGISTRY_PORT:8081}
    consumer:
      auto-offset-reset: earliest
      group-id: event_group
      key-deserializer: io.confluent.kafka.serializers.KafkaAvroDeserializer
      value-deserializer: io.confluent.kafka.serializers.KafkaAvroDeserializer
      properties:
        schema.registry.url: ${spring.kafka.schema.registry.url}
        specific.avro.reader: true
    producer:
      acks: -1
      key-serializer: io.confluent.kafka.serializers.KafkaAvroSerializer
      value-serializer: io.confluent.kafka.serializers.KafkaAvroSerializer
      properties:
        schema.registry.url: ${spring.kafka.schema.registry.url}
        auto.register.schemas: true
        use.latest.version: true
    streams:
      properties:
        schema.registry.url: ${spring.kafka.schema.registry.url}
        default.key.serde: io.confluent.kafka.streams.serdes.avro.SpecificAvroSerde
        default.value.serde: io.confluent.kafka.streams.serdes.avro.SpecificAvroSerde
