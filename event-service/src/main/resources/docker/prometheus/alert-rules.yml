groups:
  - name: renovation-event-service-rules
    rules:
      # Triggers a critical alert if a server is down for more than 1 minute.
      - alert: ServerDown
        expr: up < 1
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Server {{ $labels.instance }} DOWN"
          description: "{{ $labels.instance }} of job {{ $labels.job }} has been down for more than 1 minute."

      # Triggers a critical alert if a component of /actuator/helth is DOWN for more than 1 minute
      - alert: ComponentDown
        expr: health_component_status < 1
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Component {{ $labels.component }} DOWN"
          description: "Health check shows the component {{ $labels.component }} has been down for more than 1 minute."

      # Triggers a critical alert if CPU usage of 'spring-boot-prometheus' exceeds 80% over 5 minutes.
      - alert: HighCpuUsage
        expr: sum(rate(process_cpu_usage{job="spring-boot-prometheus"}[5m])) > 0.2
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: High CPU usage detected for spring-boot-prometheus
          description: CPU usage of 'spring-boot-prometheus' has exceeded 80% for the past 5 minutes.
