global:
  parentChartName: renovation
  namespace:
    infra: infra       # ingress, service-mesh control plane, monitoring, cert-manager, logging
    db: db             # databases, message brokers, caches
    apps: apps         # application workloads
    security: security # Keycloak, Vault, etc.

postgresql: #bitnami
  enabled: true
  architecture: replication
  namespaceOverride: db
  fullnameOverride: postgresql
  auth:
    username: postgres
    password: postgres1
    database: renovation
  schema: backend
  primary:
    service:
      type: NodePort
      nodePorts:
        postgresql: 30432
    initdb:
      scriptsConfigMap: postgresql-init-configmap
    persistence:
      existingClaim: postgres-primary-0-pvc # !!! should be created in k8s
  readReplicas:
    replicaCount: 1
    service:
      type: NodePort
      nodePorts:
        postgresql: 30433
    persistence:
      existingClaim: postgres-replica-0-pvc # !!! should be created in k8s

redis: #bitnami
  enabled: true
  architecture: replication
  namespaceOverride: db
  fullnameOverride: redis
  auth:
    enabled: true
    password: redispass
  master:
    service:
      type: NodePort
      nodePorts:
        redis: "30379"
    persistence:
      existingClaim: redis-master-0-pvc # !!! should be created in k8s
  replica:
    replicaCount: 1
    service:
      type: NodePort
      nodePorts:
        redis: "30380"
    persistence:
      existingClaim: redis-replica-0-pvc # !!! should be created in k8s

mongodb: #bitnami
  enabled: true
  architecture: standalone
  namespaceOverride: db
  global:
    namespaceOverride: db # only this rewrites namespace
  fullnameOverride: mongodb
  auth:
    rootUser: root
    rootPassword: rootpass
    databases:
      - "infodb"
    usernames:
      - "infouser"
    passwords:
      - "infopassword"
  service:
    type: NodePort
    nodePorts:
      mongodb: 30017
  persistence:
    existingClaim: mongodb-master-0-pvc # !!! should be created in k8s
  initdbScriptsConfigMap: mongo-init-configmap

backend:
  enabled: true
  namespaceOverride: apps
  name: backend
  replicas: 2
  image:
    repository: koresmosto/renovation-backend
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: NodePort
    port: 8080
    nodePort: 30080
  healthCheck:
    livenessProbe:
      http:
        path: /actuator/health/liveness
      initialDelaySeconds: 30
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3
    readinessProbe:
      http:
        path: /actuator/health/readiness
      initialDelaySeconds: 10
      periodSeconds: 5
      timeoutSeconds: 3
      failureThreshold: 3
  resources:
    limits:
      cpu: "1000m"
      memory: "1Gi"
    requests:
      cpu: "500m"
      memory: "512Mi"

info:
  enabled: true
  namespaceOverride: apps
  name: info
  replicas: 2
  image:
    repository: koresmosto/renovation-info
    tag: latest
    pullPolicy: IfNotPresent
  mongo:
    username: infouser
    password: infopassword
  service:
    type: NodePort
    port: 9090
    nodePort: 30090
  healthCheck:
    livenessProbe:
      http:
        path: /actuator/health/liveness
      initialDelaySeconds: 30
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3
    readinessProbe:
      http:
        path: /actuator/health/readiness
      initialDelaySeconds: 10
      periodSeconds: 5
      timeoutSeconds: 3
      failureThreshold: 3
  resources:
    limits:
      cpu: "1000m"
      memory: "1Gi"
    requests:
      cpu: "500m"
      memory: "512Mi"

# dep. guid: https://developer.hashicorp.com/vault/tutorials/kubernetes/kubernetes-raft-deployment-guide
vault:
  enabled: true
  name: vault
  secretPath: "secret/renovation/config"
  global:
    namespace: "security"
  ui:
    enabled: true
    serviceType: NodePort
    serviceNodePort: 30820
  server:
    dev:
      enabled: false
    dataStorage:
      enabled: true
      size: 1Gi
      storageClass: vault-retain
  #authDelegator:
  #   enabled: true
