global:
  parentChartName: renovation
  namespace:
    infra: infra       # ingress, service-mesh control plane, monitoring, cert-manager, logging
    db: db             # databases, message brokers, caches
    apps: apps         # application workloads
    security: security # Keycloak, Vault, etc.

postgresql: #bitnami
  enabled: true
  architecture: standalone
  namespaceOverride: db
  fullnameOverride: postgresql
  auth:
    username: postgres
    password: postgres1
    database: renovation
  schema: backend
  primary:
    service:
      type: NodePort
      nodePorts:
        postgresql: 30432
    initdb:
      scriptsConfigMap: postgresql-init-configmap
    persistence:
      enabled: false

redis: #bitnami
  enabled: true
  architecture: standalone
  namespaceOverride: db
  fullnameOverride: redis
  auth:
    enabled: true
    password: redispass
  replica:
    replicaCount: 0  # standalone
  master:
    service:
      type: NodePort
      nodePorts:
        redis: "30379"
    persistence:
      enabled: false
      size: 1Gi

mongo:
  enabled: true
  namespaceOverride: db
  name: mongo
  deployment: StatefulSet
  replicas: 1
  image:
    repository: mongo
    tag: 5.0.6
    pullPolicy: IfNotPresent
  initdb:
    database: infodb # todo: secret # change also in healthCheck !!!
    rootuser:
      username: root
      password: rootpass
  service:
    type: NodePort
    port: 27017
    nodePort: 30017
  healthCheck:
    livenessProbe:
      exec:
        command:
          - mongo
          - infodb
          - --eval
          - db.runCommand({ping:1})  # depend on mongo.initdb.database !!!
      initialDelaySeconds: 30
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3
    readinessProbe:
      exec:
        command:
          - mongo
          - infodb
          - --eval
          - db.runCommand({ping:1})  # depend on mongo.initdb.database !!!
      initialDelaySeconds: 5
      periodSeconds: 5
      timeoutSeconds: 3
      failureThreshold: 3

backend:
  enabled: true
  namespaceOverride: apps
  name: backend
  replicas: 2
  image:
    repository: koresmosto/renovation-backend
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: NodePort
    port: 8080
    nodePort: 30080
  healthCheck:
    livenessProbe:
      http:
        path: /actuator/health/liveness
      initialDelaySeconds: 30
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3
    readinessProbe:
      http:
        path: /actuator/health/readiness
      initialDelaySeconds: 10
      periodSeconds: 5
      timeoutSeconds: 3
      failureThreshold: 3

info:
  enabled: true
  namespaceOverride: apps
  name: info
  replicas: 2
  image:
    repository: koresmosto/renovation-info
    tag: latest
    pullPolicy: IfNotPresent
  mongo:
    username: infouser
    password: infopassword
  service:
    type: NodePort
    port: 9090
    nodePort: 30090
  healthCheck:
    livenessProbe:
      http:
        path: /actuator/health/liveness
      initialDelaySeconds: 30
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3
    readinessProbe:
      http:
        path: /actuator/health/readiness
      initialDelaySeconds: 10
      periodSeconds: 5
      timeoutSeconds: 3
      failureThreshold: 3
