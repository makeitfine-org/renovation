global:
  parentChartName: renovation
  namespace:
    infra: infra       # ingress, service-mesh control plane, monitoring, cert-manager, logging
    db: db             # databases, message brokers, caches
    apps: apps         # application workloads
    security: security # Keycloak, Vault, etc.

postgresql: #bitnami
  enabled: true
  architecture: standalone
  namespaceOverride: db
  fullnameOverride: postgresql
  auth:
    username: postgres
    password: postgres1
    database: renovation
  schema: backend
  primary:
    service:
      type: NodePort
      nodePorts:
        postgresql: 30432
    initdb:
      scriptsConfigMap: postgresql-init-configmap
    persistence:
      enabled: false

redis: #bitnami
  enabled: true
  architecture: replication
  namespaceOverride: db
  fullnameOverride: redis
  auth:
    enabled: true
    password: redispass
  master:
    service:
      type: NodePort
      nodePorts:
        redis: "30379"
    persistence:
      enabled: false
      size: 1Gi
  replica:
    replicaCount: 1
    service:
      type: NodePort
      nodePorts:
        redis: "30380"
    persistence:
      enabled: false
      size: 1Gi

mongodb: #bitnami
  enabled: true
  architecture: standalone
  namespaceOverride: db
  global:
    namespaceOverride: db # only this rewrites namespace
  fullnameOverride: mongodb
  auth:
    rootUser: root
    rootPassword: rootpass
    databases:
      - "infodb"
    usernames:
      - "infouser"
    passwords:
      - "infopassword"
  service:
    type: NodePort
    nodePorts:
      mongodb: 30017
  persistence:
    enabled: false
    size: 1Gi
  initdbScriptsConfigMap: mongo-init-configmap

backend:
  enabled: true
  namespaceOverride: apps
  name: backend
  replicas: 2
  image:
    repository: koresmosto/renovation-backend
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: NodePort
    port: 8080
    nodePort: 30080
  healthCheck:
    livenessProbe:
      http:
        path: /actuator/health/liveness
      initialDelaySeconds: 30
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3
    readinessProbe:
      http:
        path: /actuator/health/readiness
      initialDelaySeconds: 10
      periodSeconds: 5
      timeoutSeconds: 3
      failureThreshold: 3

info:
  enabled: true
  namespaceOverride: apps
  name: info
  replicas: 2
  image:
    repository: koresmosto/renovation-info
    tag: latest
    pullPolicy: IfNotPresent
  mongo:
    username: infouser
    password: infopassword
  service:
    type: NodePort
    port: 9090
    nodePort: 30090
  healthCheck:
    livenessProbe:
      http:
        path: /actuator/health/liveness
      initialDelaySeconds: 30
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3
    readinessProbe:
      http:
        path: /actuator/health/readiness
      initialDelaySeconds: 10
      periodSeconds: 5
      timeoutSeconds: 3
      failureThreshold: 3
