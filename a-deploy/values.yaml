global:
  parentChartName: renovation
  namespace:
    platform: platform # ingress, service-mesh control plane, monitoring, cert-manager
    infra: infra # databases (Postgres StatefulSets, MongoDB), shared infra (RabbitMQ/Redis)
    security: security # keycloak (OAuth2 proxy, WAF, etc.)
    apps: apps #your Spring Boot microservices (backend services)

postgres:
  enabled: true
  namespaceOverride: infra
  name: postgres
  image:
    repository: postgres
    tag: 16-alpine
    pullPolicy: IfNotPresent
  db: renovation
  schema: backend
  user: postgres # todo: secret
  password: postgres1 # todo: secret
  service:
    type: NodePort
    port: 5432
    nodePort: 30432

redis:
  enabled: true
  namespaceOverride: infra
  name: redis
  image:
    repository: redis
    tag: 7.2.3-alpine
    pullPolicy: IfNotPresent
  password: redispass
  service:
    type: NodePort
    port: 6379
    nodePort: 30379

mongo:
  enabled: true
  namespaceOverride: infra
  name: mongo
  image:
    repository: mongo
    tag: 5.0.6
    pullPolicy: IfNotPresent
  initdb:
    database: infodb
    rootuser:
      username: root
      password: rootpass
  service:
    type: NodePort
    port: 27017
    nodePort: 30017

backend:
  enabled: true
  namespaceOverride: apps
  name: backend
  image:
    repository: koresmosto/renovation-backend
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: NodePort
    port: 8080
    nodePort: 30080
  healthCheck:
    livenessProbe:
      http:
        path: /actuator/health/liveness
      initialDelaySeconds: 30
      periodSeconds: 10
    readinessProbe:
      http:
        path: /actuator/health/readiness
      initialDelaySeconds: 10
      periodSeconds: 5

info:
  enabled: true
  namespaceOverride: apps
  name: info
  image:
    repository: koresmosto/renovation-info
    tag: latest
    pullPolicy: IfNotPresent
  mongo:
    username: infouser
    password: infopassword
  service:
    type: NodePort
    port: 9090
    nodePort: 30090
  healthCheck:
    livenessProbe:
      http:
        path: /actuator/health/liveness
      initialDelaySeconds: 30
      periodSeconds: 10
    readinessProbe:
      http:
        path: /actuator/health/readiness
      initialDelaySeconds: 10
      periodSeconds: 5
