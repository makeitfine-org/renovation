global:
  parentChartName: renovation
  namespace:
    infra: infra       # ingress, service-mesh control plane, monitoring, cert-manager, logging
    db: db             # databases, message brokers, caches
    apps: apps         # application workloads
    security: security # Keycloak, Vault, etc.

# dep. guid: https://developer.hashicorp.com/vault/tutorials/kubernetes/kubernetes-raft-deployment-guide
vault-chart:
  enabled: true
  vault:
    name: vault
    secretPath: "secret/renovation/secrets"
    global:
      namespace: "security"
    ui:
      enabled: true
      serviceType: NodePort
      serviceNodePort: 30820
    server:
      dev:
        enabled: false
      dataStorage:
        enabled: true
        size: 1Gi
        storageClass: vault-retain

external-secrets-chart:
  enabled: true
  external-secrets:
    name: extsecrets
    namespaceOverride: security
    installCRDs: true

postgresql-chart: #bitnami
  enabled: true
  postgresql: #bitnami
    architecture: replication
    namespaceOverride: db
    fullnameOverride: postgresql
    auth:
      username: $POSTGRES_USER
      password: $POSTGRES_PASSWORD
      database: $POSTGRES_DB
      replicationUsername: $POSTGRES_USER # !!! todo: create separate rep_user
      replicationPassword: $POSTGRES_PASSWORD # !!! todo: create separate rep_pass
    schema: $POSTGRES_SCHEMA
    primary:
      service:
        type: NodePort
        nodePorts:
          postgresql: 30432
      initdb:
        scriptsConfigMap: postgresql-init-configmap
      persistence:
        existingClaim: postgres-primary-0-pvc # !!! should be created in k8s
    readReplicas:
      replicaCount: 1
      service:
        type: NodePort
        nodePorts:
          postgresql: 30433
      persistence:
        existingClaim: postgres-replica-0-pvc # !!! should be created in k8s

redis-chart:
  enabled: true
  redis: #bitnami
    architecture: replication
    namespaceOverride: db
    fullnameOverride: redis
    auth:
      enabled: true
      password: $REDIS_PASSWORD
    master:
      service:
        type: NodePort
        nodePorts:
          redis: "30379"
      persistence:
        existingClaim: redis-master-0-pvc # !!! should be created in k8s
    replica:
      replicaCount: 1
      service:
        type: NodePort
        nodePorts:
          redis: "30380"
      persistence:
        existingClaim: redis-replica-0-pvc # !!! should be created in k8s

mongodb-chart:
  enabled: true
  mongodb: #bitnami
    architecture: standalone
    namespaceOverride: db
    global:
      namespaceOverride: db # only this rewrites namespace
    fullnameOverride: mongodb
    auth:
      rootUser: $MONGO_INITDB_ROOT_USERNAME
      rootPassword: $MONGO_INITDB_ROOT_PASSWORD
      databases:
        - $MONGO_DB
      usernames:
        - $MONGO_USERNAME
      passwords:
        - $MONGO_PASSWORD
    service:
      type: NodePort
      nodePorts:
        mongodb: 30017
    persistence:
      existingClaim: mongodb-master-0-pvc # !!! should be created in k8s
    initdbScriptsConfigMap: mongo-init-configmap

backend:
  enabled: true
  namespaceOverride: apps
  name: backend
  replicas: 2
  image:
    repository: koresmosto/renovation-backend
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: NodePort
    port: 8080
    nodePort: 30080
  healthCheck:
    livenessProbe:
      http:
        path: /actuator/health/liveness
      initialDelaySeconds: 30
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3
    readinessProbe:
      http:
        path: /actuator/health/readiness
      initialDelaySeconds: 10
      periodSeconds: 5
      timeoutSeconds: 3
      failureThreshold: 3
  resources:
    limits:
      cpu: "1000m"
      memory: "1Gi"
    requests:
      cpu: "500m"
      memory: "512Mi"

info:
  enabled: true
  namespaceOverride: apps
  name: info
  replicas: 2
  image:
    repository: koresmosto/renovation-info
    tag: latest
    pullPolicy: IfNotPresent
  mongo:
    username: $MONGO_USERNAME
    password: $MONGO_PASSWORD
  service:
    type: NodePort
    port: 9090
    nodePort: 30090
  healthCheck:
    livenessProbe:
      http:
        path: /actuator/health/liveness
      initialDelaySeconds: 30
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3
    readinessProbe:
      http:
        path: /actuator/health/readiness
      initialDelaySeconds: 10
      periodSeconds: 5
      timeoutSeconds: 3
      failureThreshold: 3
  resources:
    limits:
      cpu: "1000m"
      memory: "1Gi"
    requests:
      cpu: "500m"
      memory: "512Mi"
