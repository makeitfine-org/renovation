global:
  parentChartName: renovation

postgres:
  enabled: true
  name: postgres
  image:
    repository: postgres
    tag: 16-alpine
    pullPolicy: IfNotPresent
  db: renovation
  schema: backend
  user: postgres # todo: secret
  password: postgres1 # todo: secret
  service:
    type: NodePort
    port: 5432
    nodePort: 30432

redis:
  enabled: true
  name: redis
  image:
    repository: redis
    tag: 7.2.3-alpine
    pullPolicy: IfNotPresent
  password: redispass
  service:
    type: NodePort
    port: 6379
    nodePort: 30379

mongo:
  enabled: true
  name: mongo
  image:
    repository: mongo
    tag: 5.0.6
    pullPolicy: IfNotPresent
  initdb:
    database: infodb
    username: root
    password: rootpass
  service:
    type: NodePort
    port: 27017
    nodePort: 30017

backend:
  enabled: true
  name: backend
  image:
    repository: koresmosto/renovation-backend
    tag: latest
    pullPolicy: IfNotPresent

  service:
    type: NodePort
    port: 8080
    nodePort: 30080
