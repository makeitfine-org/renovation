global:
  parentChartName: renovation
  namespace:
    infra: infra       # ingress, service-mesh control plane, monitoring, cert-manager, logging
    db: db             # databases, message brokers, caches
    apps: apps         # application workloads
    security: security # Keycloak, Vault, etc.

postgresql: #bitnami
  enabled: true
  fullnameOverride: postgresql
  architecture: standalone
  namespaceOverride: db
  primary:
    service:
      type: NodePort
      nodePorts:
        postgresql: 30432
    initdb:
      scripts:
        01-create-schema.sql: |
          CREATE SCHEMA IF NOT EXISTS backend AUTHORIZATION postgres;
          GRANT ALL PRIVILEGES ON SCHEMA backend TO postgres;
  auth:
    username: postgres
    password: postgres1
    database: renovation
#  primary:
#    persistence:
#      enabled: false

postgres: # disabled / bitnami postgres using instead
  enabled: false
  namespaceOverride: db
  name: postgres
  deployment: StatefulSet
  replicas: 1
  image:
    repository: postgres
    tag: 16-alpine
    pullPolicy: IfNotPresent
  db: renovation
  schema: backend
  user: postgres # todo: secret # change also in healthCheck !!!
  password: postgres1 # todo: secret
  service:
    type: NodePort
    port: 5432
    nodePort: 30432
  persistence:
    size: 1Gi
  healthCheck:
    livenessProbe:
      exec:
        command:
          - pg_isready
          - -U
          - postgres  # depend on postgres.user !!!
      initialDelaySeconds: 30
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3
    readinessProbe:
      exec:
        command:
          - pg_isready
          - -U
          - postgres # depend on postgres.user !!!
      initialDelaySeconds: 5
      periodSeconds: 5
      timeoutSeconds: 3
      failureThreshold: 3

redis:
  enabled: true
  namespaceOverride: db
  name: redis
  deployment: StatefulSet
  replicas: 1
  image:
    repository: redis
    tag: 7.2.3-alpine
    pullPolicy: IfNotPresent
  password: redispass
  service:
    type: NodePort
    port: 6379
    nodePort: 30379
  healthCheck:
    livenessProbe:
      exec:
        command:
          - redis-cli
          - ping
      initialDelaySeconds: 30
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3
    readinessProbe:
      exec:
        command:
          - redis-cli
          - ping
      initialDelaySeconds: 5
      periodSeconds: 5
      timeoutSeconds: 3
      failureThreshold: 3

mongo:
  enabled: true
  namespaceOverride: db
  name: mongo
  deployment: StatefulSet
  replicas: 1
  image:
    repository: mongo
    tag: 5.0.6
    pullPolicy: IfNotPresent
  initdb:
    database: infodb # todo: secret # change also in healthCheck !!!
    rootuser:
      username: root
      password: rootpass
  service:
    type: NodePort
    port: 27017
    nodePort: 30017
  healthCheck:
    livenessProbe:
      exec:
        command:
          - mongo
          - infodb
          - --eval
          - db.runCommand({ping:1})  # depend on mongo.initdb.database !!!
      initialDelaySeconds: 30
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3
    readinessProbe:
      exec:
        command:
          - mongo
          - infodb
          - --eval
          - db.runCommand({ping:1})  # depend on mongo.initdb.database !!!
      initialDelaySeconds: 5
      periodSeconds: 5
      timeoutSeconds: 3
      failureThreshold: 3

backend:
  enabled: true
  namespaceOverride: apps
  name: backend
  replicas: 2
  image:
    repository: koresmosto/renovation-backend
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: NodePort
    port: 8080
    nodePort: 30080
  healthCheck:
    livenessProbe:
      http:
        path: /actuator/health/liveness
      initialDelaySeconds: 30
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3
    readinessProbe:
      http:
        path: /actuator/health/readiness
      initialDelaySeconds: 10
      periodSeconds: 5
      timeoutSeconds: 3
      failureThreshold: 3

info:
  enabled: true
  namespaceOverride: apps
  name: info
  replicas: 2
  image:
    repository: koresmosto/renovation-info
    tag: latest
    pullPolicy: IfNotPresent
  mongo:
    username: infouser
    password: infopassword
  service:
    type: NodePort
    port: 9090
    nodePort: 30090
  healthCheck:
    livenessProbe:
      http:
        path: /actuator/health/liveness
      initialDelaySeconds: 30
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3
    readinessProbe:
      http:
        path: /actuator/health/readiness
      initialDelaySeconds: 10
      periodSeconds: 5
      timeoutSeconds: 3
      failureThreshold: 3
