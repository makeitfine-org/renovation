apiVersion: apps/v1
kind: Deployment
metadata:
  name: tempo3
  namespace: security
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tempo3
  template:
    metadata:
      labels:
        app: tempo3
#      annotations:
#        vault.hashicorp.com/agent-inject: "true"
#        vault.hashicorp.com/agent-inject-status: "update"
#        vault.hashicorp.com/role: "internal-app"
#        vault.hashicorp.com/agent-inject-secret-fconfig.txt: "secret/renovation/config"
#        vault.hashicorp.com/agent-inject-secret-fconfig2.txt: "secret/data/renovation/config"
#        vault.hashicorp.com/agent-inject-secret-ABC_V2: "secret/data/renovation/config"
#        vault.hashicorp.com/agent-inject-secret-ABC_V: "secret/renovation/config"
#        vault.hashicorp.com/agent-inject-template-config.env.sh: |
