#          {{- range $k, $v := .Data.data }}
#          export {{ $k }}="{{ $v }}"
#          {{- end }}
#          {{- end }}
    spec:
      serviceAccountName: internal-app
      containers:
        - name: "tempo3"
          image: "koresmosto/renovation-backend"
          imagePullPolicy: "IfNotPresent"
          command:
            - /bin/sh
            - -ec
            - |
              echo "source..."
              #source /vault/secrets/config.env.sh
              echo $ABC_V
              echo $ABC_V2
              echo $MONGO_DB

              echo "app..."
              java -Dspring.profiles.active=no-security,postgres-replication -jar /app.jar
          envFrom:
            - secretRef:
                name: renovation-secret2
#          envFrom:
#            - configMapRef:
#                name: renovation-configmap
#            - secretRef:
#                name: renovation-secret
          ports:
            - containerPort: 8080
