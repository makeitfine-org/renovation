apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: renovation-external-secret
  namespace: security
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: renovation-secret2   # will be created as a Kubernetes Secret
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: secret/data/renovation/config
