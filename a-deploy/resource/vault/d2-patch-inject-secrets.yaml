spec:
  template:
    metadata:
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/agent-inject-status: "update"
        vault.hashicorp.com/role: "internal-app"
        vault.hashicorp.com/agent-inject-secret-fconfig.txt: "secret/renovation/config"
        vault.hashicorp.com/agent-inject-template-db-pwd: |
          {{`{{- with secret "secret/renovation/config" -}}`}}
          export ENV_V1="{{ .Data.data.ABC_V }}"
          export ENV_V2="222"
          {{`{{- end -}}`}}
