# Create a cluster-scoped PersistentVolume
apiVersion: v1
kind: PersistentVolume
metadata:
  name: redis-master-0-pv
spec:
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: standard
  hostPath:
    path: /mnt/data/redis/master
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: redis-replica-0-pv
spec:
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: standard
  hostPath:
    path: /mnt/data/redis/replica
