# Create a cluster-scoped PersistentVolume
apiVersion: v1
kind: PersistentVolume
metadata:
  name: mongodb-master-0-pv
spec:
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: standard
  hostPath:
    path: /mnt/data/mongodb/master
