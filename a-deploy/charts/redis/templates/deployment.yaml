apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - redis-server
            - "--requirepass"
            - "$(REDIS_PASSWORD)"
            - "--maxmemory"
            - "256mb"
          ports:
            - containerPort: 6379
          envFrom:
            - configMapRef: # todo: think of using only needed keys
                name: {{ .Values.global.parentChartName }}-configmap
            - secretRef:
                name: {{ .Values.global.parentChartName }}-secret
{{/*          command: ["/bin/sh","-c"]*/}}
{{/*          args:*/}}
{{/*            - "redis-server --requirepass ${REDIS_PASSWORD} --maxmemory 256mb"*/}}
