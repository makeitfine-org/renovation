{{/*todo: create for multiple namespaces*/}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: internal-app
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.vault.name }}-unseal-sa
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Values.vault.name }}-unseal-role
rules:
  - apiGroups: [ "" ]
    resources: [ "pods" ]
    verbs: [ "get", "list", "watch" ]
  - apiGroups: [ "" ]
    resources: [ "pods/exec" ]
    verbs: [ "create" ]  # allow exec
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Values.vault.name }}-unseal-rb
subjects:
  - kind: ServiceAccount
    name: {{ .Values.vault.name }}-unseal-sa
roleRef:
  kind: Role
  name: {{ .Values.vault.name }}-unseal-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Values.vault.name }}-unseal
spec:
  template:
    spec:
      serviceAccountName: {{ .Values.vault.name }}-unseal-sa
      restartPolicy: Never
      containers:
        - name: kubectl
          image: bitnami/kubectl:1.33.4
          env:
            - name: VAULT_UNSEAL_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.vault.name }}-secret
                  key: unsealKey
            - name: VAULT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.vault.name }}-secret
                  key: token
          command: [ "/bin/sh", "-c" ]
          args:
            - |
              if kubectl get -n {{ .Release.Namespace }} pod {{ .Release.Name }}-{{ .Values.vault.name }}-0  >/dev/null 2>&1; then
                export POD_NAME={{ .Release.Name }}-{{ .Values.vault.name }}-0
              else
                export POD_NAME={{ .Release.Name }}-0
              fi

              echo $POD_NAME

              alias COM="kubectl exec -n {{ .Release.Namespace }} $POD_NAME -- sh -c"
              COM "vault operator unseal $VAULT_UNSEAL_KEY"

              {{/* # Play with env. vars !!! todo: delete envvars. (insecure) */}}
              COM "\
                      echo $VAULT_UNSEAL_KEY > /tmp/envvars.txt; \
                      echo \$VAULT_ADDR >> /tmp/envvars.txt; \
                      echo $VAULT_TOKEN >> /tmp/envvars.txt; \
                  "
