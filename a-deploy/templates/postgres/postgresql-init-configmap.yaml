apiVersion: v1
kind: ConfigMap
metadata:
  name: postgresql-init-configmap
  namespace: {{ .Values.postgresql.namespaceOverride }}
data:
  01-create-schema.sql: |
    CREATE SCHEMA IF NOT EXISTS {{ .Values.postgresql.schema }} AUTHORIZATION {{ .Values.postgresql.auth.username }};
    GRANT ALL PRIVILEGES ON SCHEMA {{ .Values.postgresql.schema }} TO {{ .Values.postgresql.auth.username }};
