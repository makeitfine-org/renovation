{{- $root := . -}}

{{- if .Values.global.secrets.enabled -}}

{{- range $ns := .Values.global.secrets.namespaces }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: internal-app
  namespace: {{ $ns }}
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: {{ include "ca.fullname" $root }}-vault-store-{{ $ns }}
  namespace: {{ $ns }}
spec:
  provider:
    vault:
      server:  {{ $root.Values.global.secrets.vault.servicePath | quote }}
      path: "secret"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "internal-app"
          serviceAccountRef:
            name: internal-app
            namespace: {{ $ns }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "ca.fullname" $root }}-vault-external-secret
  namespace: {{ $ns }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ include "ca.fullname" $root }}-vault-store-{{ $ns }}
  target:
    name: extsecrets-postgres-secret   # will be created as a Kubernetes Secret
    creationPolicy: Owner
  data:
    - secretKey: POSTGRES_DB   # key in the K8s Secret
      remoteRef:
        key: renovation/secrets # Vault path (without "secret/data/")
        property: POSTGRES_DB  # field inside that secret
    - secretKey: POSTGRES_USER
      remoteRef:
        key: renovation/secrets
        property: POSTGRES_USER
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: renovation/secrets
        property: POSTGRES_PASSWORD
    - secretKey: POSTGRES_SCHEMA
      remoteRef:
        key: renovation/secrets
        property: POSTGRES_SCHEMA
---
{{- end }}

{{- end }}
