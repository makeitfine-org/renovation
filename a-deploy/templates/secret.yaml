{{- $root := . }}

{{- $nsList := list }}
{{- range $key, $ns := $root.Values.global.namespace }}
  {{- $nsList = append $nsList $ns }}
{{- end }}
{{- $nsList = append $nsList $root.Release.Namespace }}

{{- range $ns := $nsList }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $root.Values.global.parentChartName }}-secret-unused
  namespace: {{ $ns }}
type: Opaque
data:
  POSTGRES_USER: {{ $root.Values.postgresql.auth.username | b64enc }}
  POSTGRES_PASSWORD: {{ $root.Values.postgresql.auth.password | b64enc }}
  POSTGRES_DB: {{ $root.Values.postgresql.auth.database | b64enc }}

  REDIS_PASSWORD: {{ $root.Values.redis.auth.password | b64enc }}

  MONGO_INITDB_ROOT_PASSWORD: {{ $root.Values.mongodb.auth.rootPassword | b64enc }}
  MONGO_PASSWORD: {{ index $root.Values.mongodb.auth.passwords 0 | b64enc }}
  MONGO_INITDB_DATABASE: {{ index $root.Values.mongodb.auth.databases 0 | b64enc }}
  MONGO_INITDB_ROOT_USERNAME: {{ $root.Values.mongodb.auth.rootUser | b64enc }}
  MONGO_USERNAME: {{ index $root.Values.mongodb.auth.usernames 0 | b64enc }}
  MONGO_DB: {{ index $root.Values.mongodb.auth.databases 0 | b64enc }}
---
{{- end }}
