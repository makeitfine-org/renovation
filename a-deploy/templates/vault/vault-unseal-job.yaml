{{/*todo: create for multiple namespaces*/}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: internal-app
  namespace: {{ .Values.vault.global.namespace }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.vault.name }}-unseal-sa
  namespace: {{ .Values.vault.global.namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Values.vault.name }}-unseal-role
  namespace: {{ .Values.vault.global.namespace }}
rules:
  - apiGroups: [ "" ]
    resources: [ "pods" ]
    verbs: [ "get", "list", "watch" ]
  - apiGroups: [ "" ]
    resources: [ "pods/exec" ]
    verbs: [ "create" ]  # allow exec
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Values.vault.name }}-unseal-rb
  namespace: {{ .Values.vault.global.namespace }}
subjects:
  - kind: ServiceAccount
    name: {{ .Values.vault.name }}-unseal-sa
    namespace: {{ .Values.vault.global.namespace }}
roleRef:
  kind: Role
  name: {{ .Values.vault.name }}-unseal-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Values.vault.name }}-unseal
  namespace: {{ .Values.vault.global.namespace }}
spec:
  template:
    spec:
      serviceAccountName: {{ .Values.vault.name }}-unseal-sa
      containers:
        - name: kubectl
          image: bitnami/kubectl:1.33.4
          env:
            - name: VAULT_UNSEAL_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.vault.name }}-secret
                  key: unsealKey
            - name: VAULT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.vault.name }}-secret
                  key: token
          command: [ "/bin/sh", "-c" ]
          args:
            - |
              alias COM="kubectl exec -n {{ .Values.vault.global.namespace }} {{ .Release.Name }}-{{ .Values.vault.name }}-0 -- sh -c"
              COM "vault operator unseal $VAULT_UNSEAL_KEY"

              {{/* # Play with env. vars !!! todo: delete envvars. (insecure) */}}
              COM "\
                      echo $VAULT_UNSEAL_KEY > /tmp/envvars.txt; \
                      echo \$VAULT_ADDR >> /tmp/envvars.txt; \
                      echo $VAULT_TOKEN >> /tmp/envvars.txt; \
                  "
      restartPolicy: Never
