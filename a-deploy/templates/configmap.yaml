{{- $root := . }}

{{- $nsList := list }}
{{- $ns_default := $root.Release.Namespace }}

{{- range $key, $ns := $root.Values.global.namespace }}
  {{- $nsList = append $nsList $ns }}
{{- end }}
{{- $nsList = append $nsList $root.Release.Namespace }}

{{- range $ns := $nsList }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $root.Values.global.parentChartName }}-configmap
  namespace: {{ $ns }}
data:
  POSTGRES_DB: {{ $root.Values.postgresql.auth.database | quote }}

  POSTGRES_DB_URL: "jdbc:postgresql://{{ $root.Values.postgresql.fullnameOverride }}.{{ $root.Values.postgresql.namespaceOverride | default $ns_default }}.svc.cluster.local:{{ $root.Values.postgresql.primary.service.ports.postgresql }}/renovation?currentSchema=backend"

  INFO_SERVICE_URL: "http://{{ $root.Values.info.name }}.{{ $root.Values.info.namespaceOverride | default $ns_default }}.svc.cluster.local:{{ $root.Values.info.service.port }}/graphql"

  REDIS_HOST: "{{ $root.Values.redis.fullnameOverride }}-master.{{ $root.Values.redis.namespaceOverride | default $ns_default}}.svc.cluster.local"
  REDIS_PORT: {{ $root.Values.redis.master.service.ports.redis | quote }}

  MONGO_INITDB_DATABASE: {{ $root.Values.mongo.initdb.database | quote }}
  MONGO_INITDB_ROOT_USERNAME: {{ $root.Values.mongo.initdb.rootuser.username | quote }}

  MONGO_USERNAME: {{ $root.Values.info.mongo.username | quote }}
  MONGO_DB: {{ $root.Values.mongo.initdb.database | quote }}
  MONGO_HOST: "{{ $root.Values.mongo.name }}.{{ $root.Values.mongo.namespaceOverride | default $ns_default }}.svc.cluster.local"
  MONGO_PORT: {{ $root.Values.mongo.service.port | quote }}
---
{{- end }}
