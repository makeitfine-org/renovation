{{- if .Values.global.createConfigmap -}}

{{- $root := . }}
{{- $ns_default := $root.Release.Namespace }}
{{- range $ns := list .Values.global.namespace.apps }}

apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $root.Values.global.parentChartName }}-configmap
  namespace: {{ $ns }}
data:
  {{ if $root.Values.postgresqlC.enabled }}
  POSTGRES_DB_URL: "jdbc:postgresql://{{ $root.Values.postgresqlC.postgresql.fullnameOverride }}.{{ $root.Values.postgresqlC.postgresql.namespaceOverride | default $ns_default }}.svc.cluster.local:{{ $root.Values.postgresqlC.postgresql.primary.service.ports.postgresql }}/{{ $root.Values.postgresqlC.postgresql.auth.database }}?currentSchema={{ $root.Values.postgresqlC.postgresql.schema}}"
  POSTGRES_RW_DB_URL: "jdbc:postgresql://{{ $root.Values.postgresqlC.postgresql.fullnameOverride }}-primary.{{ $root.Values.postgresqlC.postgresql.namespaceOverride | default $ns_default }}.svc.cluster.local:{{ $root.Values.postgresqlC.postgresql.primary.service.ports.postgresql }}/{{ $root.Values.postgresqlC.postgresql.auth.database }}?currentSchema={{ $root.Values.postgresqlC.postgresql.schema}}"
  POSTGRES_RO_DB_URL: "jdbc:postgresql://{{ $root.Values.postgresqlC.postgresql.fullnameOverride }}-read.{{ $root.Values.postgresqlC.postgresql.namespaceOverride | default $ns_default }}.svc.cluster.local:{{ $root.Values.postgresqlC.postgresql.readReplicas.service.ports.postgresql }}/{{ $root.Values.postgresqlC.postgresql.auth.database }}?currentSchema={{ $root.Values.postgresqlC.postgresql.schema}}"
  {{- else }}
  POSTGRES_DB_URL: ""
  POSTGRES_RW_DB_URL: ""
  POSTGRES_RO_DB_URL: ""
  {{- end }}

  {{ if $root.Values.info.enabled }}
  INFO_SERVICE_URL: "http://{{ $root.Values.info.name }}.{{ $root.Values.info.namespaceOverride | default $ns_default }}.svc.cluster.local:{{ $root.Values.info.service.port }}/graphql"
  {{- else }}
  INFO_SERVICE_URL: ""
  {{- end }}

  {{ if $root.Values.redisC.enabled }}
  REDIS_HOST: "{{ $root.Values.redisC.redis.fullnameOverride }}-master.{{ $root.Values.redisC.redis.namespaceOverride | default $ns_default}}.svc.cluster.local"
  REDIS_PORT: {{ $root.Values.redisC.redis.master.service.ports.redis | quote }}
  {{- else }}
  REDIS_HOST: ""
  REDIS_PORT: ""
  {{- end }}

  {{ if $root.Values.mongodbC.enabled }}
  MONGO_HOST: "{{ $root.Values.mongodbC.mongodb.fullnameOverride }}.{{ $root.Values.mongodbC.mongodb.namespaceOverride | default $ns_default }}.svc.cluster.local"
  MONGO_PORT: {{ $root.Values.mongodbC.mongodb.service.ports.mongodb | quote}}
  {{- else }}
  MONGO_HOST: ""
  MONGO_PORT: ""
  {{- end }}
---
{{- end }}

{{- end }}
