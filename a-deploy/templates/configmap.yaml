{{- $root := . }}

{{- $nsList := list }}
{{- $ns_default := $root.Release.Namespace }}

{{- range $key, $ns := $root.Values.global.namespace }}
  {{- $nsList = append $nsList $ns }}
{{- end }}
{{- $nsList = append $nsList $root.Release.Namespace }}

{{- range $ns := $nsList }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $root.Values.global.parentChartName }}-configmap
  namespace: {{ $ns }}
data:
  POSTGRES_DB_URL: "jdbc:postgresql://{{ $root.Values.postgresql.fullnameOverride }}.{{ $root.Values.postgresql.namespaceOverride | default $ns_default }}.svc.cluster.local:{{ $root.Values.postgresql.primary.service.ports.postgresql }}/renovation?currentSchema={{ $root.Values.postgresql.schema}}"

  POSTGRES_RW_DB_URL: "jdbc:postgresql://{{ $root.Values.postgresql.fullnameOverride }}-primary.{{ $root.Values.postgresql.namespaceOverride | default $ns_default }}.svc.cluster.local:{{ $root.Values.postgresql.primary.service.ports.postgresql }}/renovation?currentSchema={{ $root.Values.postgresql.schema}}"
  POSTGRES_RO_DB_URL: "jdbc:postgresql://{{ $root.Values.postgresql.fullnameOverride }}-read.{{ $root.Values.postgresql.namespaceOverride | default $ns_default }}.svc.cluster.local:{{ $root.Values.postgresql.primary.service.ports.postgresql }}/renovation?currentSchema={{ $root.Values.postgresql.schema}}"

  INFO_SERVICE_URL: "http://{{ $root.Values.info.name }}.{{ $root.Values.info.namespaceOverride | default $ns_default }}.svc.cluster.local:{{ $root.Values.info.service.port }}/graphql"

  REDIS_HOST: "{{ $root.Values.redis.fullnameOverride }}-master.{{ $root.Values.redis.namespaceOverride | default $ns_default}}.svc.cluster.local"
  REDIS_PORT: {{ $root.Values.redis.master.service.ports.redis | quote }}

  MONGO_HOST: "{{ $root.Values.mongodb.fullnameOverride }}.{{ $root.Values.mongodb.namespaceOverride | default $ns_default }}.svc.cluster.local"
  MONGO_PORT: {{ $root.Values.mongodb.service.ports.mongodb | quote}}
---
{{- end }}
