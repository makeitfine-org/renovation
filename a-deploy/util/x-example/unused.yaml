apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-springboot
  labels:
    {{- include "myapp.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "myapp.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "myapp.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: springboot
          image: myorg/springboot-app:{{ .Chart.AppVersion }}
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://{{ .Values.postgresql.fullnameOverride }}.{{ .Release.Namespace }}.svc.cluster.local:5432/{{ .Values.postgresql.auth.database }}
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgresql.auth.existingSecret | default (printf "%s-postgresql" .Release.Name) }}
                  key: postgresql-username
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.postgresql.fullnameOverride | default (printf "%s-postgresql" .Release.Name) }}
  labels:
    {{- include "myapp.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "myapp.selectorLabels" . | nindent 4 }}
  ports:
    - port: 5432
      targetPort: 5432
      protocol: TCP
      name: postgresql
---
apiVersion: v1
kind: Pod
metadata:
  name: my-pod
  labels:
    app.kubernetes.io/name: my-app
    app.kubernetes.io/instance: release-1
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-deployment
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: my-app
      app.kubernetes.io/instance: release-1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: my-app
        app.kubernetes.io/instance: release-1
    spec:
      containers:
        - name: nginx
          image: nginx:latest
---
Deployment selector.matchLabels: {app=my-app, instance=release-1}
                                   |
                                   v
Pods with labels:
  Pod1: {app=my-app, instance=release-1}  --> selected ✅
  Pod2: {app=my-app}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: myapp
  labels:
    {{- include "myapp.selectorLabels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "myapp.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "myapp.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: myapp
          image: myapp:latest
