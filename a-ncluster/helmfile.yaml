# helmfile.yaml
values:
  - values.yaml

helmDefaults:
  createNamespace: true
  wait: true

helmfiles:
  -

releases:
  - name: vault
    namespace: security
    chart: hashicorp/vault
    version: 0.30.1
    condition: vault.enabled
    values:
      - secretPath: "secret/renovation/secrets"
      - ui:
          enabled: true
          serviceType: "NodePort"
          serviceNodePort: 30820
      - server:
          dev:
            enabled: false
      - dataStorage:
          enabled: true
          size: "1Gi"
          storageClass: "vault-retain"

  - name: postgresql
    namespace: db
    chart: bitnami/postgresql
    version: 16.7.24
    condition: postgresql.enabled
    values:
      - architecture: replication
      - auth:
          username: user1
          password: password1
          database: pgdb
          postgresPassword: pgrootpass1
      - schema: pgschema
      - primary:
          service:
            type: NodePort
            nodePorts:
              postgresql: 30432
  #        initdb:
  #          scriptsConfigMap: postgresql-init-configmap
          persistence:
            enabled: false
            #existingClaim: postgres-primary-0-pvc # !!! should be created in k8s
      - readReplicas:
          replicaCount: 1
          service:
            type: NodePort
            nodePorts:
              postgresql: 30433
          persistence:
            enabled: false
  #          existingClaim: postgres-replica-0-pvc # !!! should be created in k8s

  - name: redis
    namespace: db
    chart: bitnami/redis
    version: 22.0.3
    condition: redis.enabled
    values:
      - usePassword: true
      - global:
          redis:
            password: abc123
