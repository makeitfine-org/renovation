name: CI build, test

on:
  push:
    branches: [ "develop", "ai", "to_java" ]
  pull_request:
    branches: [ "develop" ]
  schedule:
    - cron: "45 23 * * 4"

concurrency:
  group: "ci-build-test"
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '26.3.1'
          cache: 'npm'
          cache-dependency-path: |
            frontend/package-lock.json
            frontend-info/package-lock.json

      - run: ./gradlew buildAll

      - name: Report Status
        if: failure()
        uses: ravsamhq/notify-slack-action@v2
        with:
          status: ${{ job.status }}
          notify_when: 'failure'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.ACTION_MONITORING_SLACK }}
