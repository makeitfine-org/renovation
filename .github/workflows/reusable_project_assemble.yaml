name: Reusable Project Assemble
on:
  workflow_call:
    inputs:
      command_line_task:
        required: true
        type: string
      timeout-minutes:
        required: false
        type: number
        default: 10
jobs:
  assemble_and_docker_run_job:
    timeout-minutes: ${{ inputs.timeout-minutes }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '26.3.1'
          cache: 'npm'
          cache-dependency-path: |
            frontend/package-lock.json
            frontend-info/package-lock.json

      - run: ./gradlew assemble

      - run: ./gradlew :frontend:npmInstall
      - run: ./gradlew :frontend:npmBuild

      - run: ./gradlew copyDistToPublic
      - run: ./gradlew :frontend-info:npmInstall
      - run: ./gradlew :frontend-info:npmBuild

      - run: docker compose up -d --build
      - run: sleep 30
      - run: docker ps

      - run: |
          ${{ inputs.command_line_task }}

      - run: docker compose down
